[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taurus-mcp"
version = "0.1.0"
description = "MCP server for read-only access to the Taurus cluster over SSH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
taurus-tools = "taurus_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["taurus_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--cov=taurus_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["taurus_mcp"]
omit = ["*/taurus_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
