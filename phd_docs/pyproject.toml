[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-docs"
version = "0.1.0"
description = "RAG index for PhD notes, specs, and Zotero PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "claudia-docs>=0.2.0",
    "fastmcp>=2.0.0",
    "langchain-chroma>=0.1.1",
    "langchain-core>=0.2.0",
    "langchain-huggingface>=0.0.3",
    "langchain-text-splitters>=0.2.0",
    "rich>=14.3.2,<14.4",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
phd-docs = "phd_docs.cli.app:main"
phd-docs-mcp = "phd_docs.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phd_docs*"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["phd_docs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=phd_docs --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["phd_docs"]
omit = [
    "*/phd_docs/__main__.py",
    "*/phd_docs/mcp/server.py",
    "*/phd_docs/cli/app.py",
    "*/phd_docs/cli/commands/query.py",
    "*/phd_docs/cli/commands/sync.py",
    "*/phd_docs/container.py",
    "*/phd_docs/extractors/coordinator.py",
    "*/phd_docs/extractors/zotero/provider.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
